[package]
name = "ngav-agent"
version = "0.1.0"
edition = "2021"
description = "NGAV agent core — hybrid detection engine (MVP)"
license = "Proprietary"

# Dependencias curadas y auditadas (Etapa 1 en adelante). El núcleo criptográfico
# propio (SHA-256, entropía) se mantiene; se añaden crates estándar de la
# industria sólo donde `std` no basta, con supply-chain auditada (cargo-deny) y
# `Cargo.lock` fijado. Ver docs/evolucion/00-analisis-arquitectura.md §5.
[dependencies]
# Vigilancia del sistema de ficheros en tiempo real, multiplataforma:
# inotify (Linux), ReadDirectoryChangesW (Windows), FSEvents (macOS).
notify = "8"

# Parser de binarios ejecutables (PE / ELF / Mach-O) para el análisis estático:
# cabeceras, secciones, imports/exports, overlay, timestamps. Crate puro Rust,
# estándar de la industria y multiplataforma.
goblin = "0.8"

# Solo en Windows: APIs oficiales de Microsoft para leer la memoria del sistema
# (GlobalMemoryStatusEx) y recortar la memoria de trabajo del propio proceso
# (SetProcessWorkingSetSizeEx) en la función "Optimizar". Son APIs estándar y
# benignas usadas por aplicaciones legítimas.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[[bin]]
name = "ngav"
path = "src/main.rs"

[lib]
name = "ngav_agent"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
