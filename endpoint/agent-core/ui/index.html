<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NGAV — Protección de nueva generación</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app">
    <!-- ===== Barra de opciones (sidebar) ===== -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="26" height="26"><path fill="currentColor" d="M12 2 4 5v6c0 5 3.4 8.7 8 11 4.6-2.3 8-6 8-11V5l-8-3Zm-1 14-4-4 1.4-1.4L11 13.2l4.6-4.6L17 10l-6 6Z"/></svg>
        </span>
        <span class="brand-name">NGAV</span>
      </div>

      <nav class="nav" id="nav">
        <button class="nav-item active" data-view="dashboard">
          <svg viewBox="0 0 24 24" class="ico"><path fill="currentColor" d="M3 13h8V3H3v10Zm0 8h8v-6H3v6Zm10 0h8V11h-8v10Zm0-18v6h8V3h-8Z"/></svg>
          <span>Panel</span>
        </button>
        <button class="nav-item" data-view="scanner">
          <svg viewBox="0 0 24 24" class="ico"><path fill="currentColor" d="M15.5 14h-.8l-.3-.3a6.5 6.5 0 1 0-.7.7l.3.3v.8l5 5 1.5-1.5-5-5Zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14Z"/></svg>
          <span>Escáner</span>
        </button>
        <button class="nav-item" data-view="detections">
          <svg viewBox="0 0 24 24" class="ico"><path fill="currentColor" d="M13 3a9 9 0 0 0-9 9H1l4 4 4-4H6a7 7 0 1 1 2 4.9l-1.5 1.5A9 9 0 1 0 13 3Zm-1 5v5l4 2 .8-1.3-3.3-2V8Z"/></svg>
          <span>Detecciones</span>
        </button>
        <button class="nav-item" data-view="quarantine">
          <svg viewBox="0 0 24 24" class="ico"><path fill="currentColor" d="M12 1 3 5v6c0 5 3.8 9.7 9 11 5.2-1.3 9-6 9-11V5l-9-4Zm0 10.9h7c-.5 3.9-3.1 7.4-7 8.6V12H5V6.3l7-3.1v8.7Z"/></svg>
          <span>Cuarentena</span>
        </button>
        <button class="nav-item" data-view="tools">
          <svg viewBox="0 0 24 24" class="ico"><path fill="currentColor" d="m22 7.7-4.6 4.6a4 4 0 0 1-5-5L17 2.7a6 6 0 0 0-8 8L2.3 17.4a2 2 0 0 0 0 2.8l1.5 1.5a2 2 0 0 0 2.8 0L13.3 15a6 6 0 0 0 8.7-7.3Z"/></svg>
          <span>Herramientas</span>
        </button>
        <button class="nav-item" data-view="settings">
          <svg viewBox="0 0 24 24" class="ico"><path fill="currentColor" d="M19.4 13a7.8 7.8 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.6 7.6 0 0 0-1.7-1l-.4-2.5h-4l-.4 2.5a7.6 7.6 0 0 0-1.7 1l-2.4-1-2 3.4L4.6 11a7.8 7.8 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.6 7.6 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7.6 7.6 0 0 0 1.7-1l2.4 1 2-3.4-2-1.6ZM12 15.5A3.5 3.5 0 1 1 15.5 12 3.5 3.5 0 0 1 12 15.5Z"/></svg>
          <span>Ajustes</span>
        </button>
      </nav>

      <div class="sidebar-foot">
        <div class="user">
          <span class="avatar">DG</span>
          <div>
            <div class="user-name">Dispositivo local</div>
            <div class="user-plan" id="foot-version">NGAV</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- ===== Contenido principal ===== -->
    <main class="main">
      <header class="topbar">
        <h1 id="page-title">Panel</h1>
        <div class="topbar-right">
          <span class="pill pill-ok" id="status-pill">
            <span class="dot"></span> Protegido
          </span>
          <button class="icon-btn" id="theme-toggle" title="Modo oscuro/claro" aria-label="Cambiar tema">
            <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.5 0-.9-.1-1.4A7 7 0 0 1 12 3Z"/></svg>
          </button>
        </div>
      </header>

      <div class="content" id="content"><!-- vistas inyectadas por JS --></div>
    </main>
  </div>

  <div class="toast" id="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
