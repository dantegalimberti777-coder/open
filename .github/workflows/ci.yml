name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  agent-rust:
    name: Agente (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: endpoint/agent-core
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup component add rustfmt clippy
      - name: Formato
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --all-targets
      - name: Build release
        run: cargo build --release
      - name: Autotest EICAR (end-to-end)
        run: ./target/release/ngav selftest

  cloud-go:
    name: Reputación (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud/reputation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Vet
        run: go vet ./...
      - name: Tests
        run: go test -race ./...
      - name: Build
        run: go build -o bin/reputation .
